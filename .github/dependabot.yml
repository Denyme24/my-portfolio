version: 2
updates:
  # Enable version updates for npm
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
    open-pull-requests-limit: 10
    labels:
      - 'dependencies'
      - 'npm'
    commit-message:
      prefix: 'chore'
      prefix-development: 'chore'
      include: 'scope'
    # Group updates to reduce PR noise
    groups:
      # Group all patch and minor updates together
      production-dependencies:
        dependency-type: 'production'
        update-types:
          - 'minor'
          - 'patch'
      development-dependencies:
        dependency-type: 'development'
        update-types:
          - 'minor'
          - 'patch'
    # Ignore major version updates for critical packages (you can review these manually)
    ignore:
      # Ignore major updates for Next.js (requires manual review)
      - dependency-name: 'next'
        update-types:
          - 'version-update:semver-major'
      # Ignore major updates for React (requires manual review)
      - dependency-name: 'react'
        update-types:
          - 'version-update:semver-major'
      - dependency-name: 'react-dom'
        update-types:
          - 'version-update:semver-major'
      # Ignore major updates for TypeScript (requires manual review)
      - dependency-name: 'typescript'
        update-types:
          - 'version-update:semver-major'
